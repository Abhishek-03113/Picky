<!doctype html>
<!-- Source of the Chrome Web Store promo images. Regenerate with: bun run --cwd apps/extension store:images -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: "Inter", system-ui, sans-serif; background: #0d5563; color: #fff; }
      .tile { width: 100vw; height: 100vh; display: flex; align-items: center; gap: 6vh; padding: 0 8vw; overflow: hidden; }
      .mascot { height: 72vh; aspect-ratio: 1; border-radius: 22.5%; box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.35); flex: none; }
      .copy { display: flex; flex-direction: column; gap: 2.4vh; }
      .name { font-size: 15vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      .line { font-size: 7.4vh; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; color: #cdeef3; }
      .stores { font-size: 5.4vh; font-weight: 500; color: #9fd6df; }
      /* The small tile is tight: a smaller mascot, the tagline only. */
      @media (max-width: 600px) {
        .tile { gap: 6vw; padding: 0 7vw; }
        .mascot { height: 60vh; }
        .line { font-size: 6.6vh; }
        .stores { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img class="mascot" src="../../web/public/mascot.png" alt="" />
      <div class="copy">
        <div class="name">Picky</div>
        <div class="line">Every detail, one page.<br />Compare side by side.</div>
        <div class="stores">For Amazon.in, Amazon.com and Flipkart</div>
      </div>
    </div>
  </body>
</html>
